name: kesholat
description: "KeSholat - Islamic Prayer Times App with automatic adhan and qibla compass"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1

  # Network & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  connectivity_plus: ^5.0.2

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Location & Compass
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  flutter_compass: ^0.8.0
  permission_handler: ^11.1.0

  # Prayer Times
  adhan: ^2.0.0+1

  # Background Service
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  flutter_background_service_ios: ^5.0.1
  workmanager: ^0.6.0
  android_alarm_manager_plus: ^4.0.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.2

  # Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # UI/UX
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  retrofit_generator: ^8.0.6
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/icons/